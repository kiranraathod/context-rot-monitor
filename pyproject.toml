[project]
name = "context-rot-monitor"
version = "0.1.0"
description = "MCP Server for monitoring, scoring, and remediating context degradation in LLM agent systems."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "google-genai>=0.3.0",
    "tiktoken>=0.5.2",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
phase2 = [
    "sentence-transformers>=2.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
context-rot-monitor = "src.server:main"
